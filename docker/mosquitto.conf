# A broker for trying the mqtt adapter on one PC (./start.sh --adapter mqtt --broker, or compose's "broker" profile).
# Anonymous and on this PC only: give it users and a listener on the network before other machines use it.
listener 1883 127.0.0.1
allow_anonymous true
persistence false
